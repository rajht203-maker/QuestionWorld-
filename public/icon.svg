<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Central Emblem: Graduation Cap / Open Book & AI Star -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Open Book Base -->
    <path d="M192 230 C 130 190, 40 200, 10 215 L 10 320 C 40 305, 130 295, 192 335 C 254 295, 344 305, 374 320 L 374 215 C 344 200, 254 190, 192 230 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M192 230 L 192 335" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>

    <!-- Bookmark Ribbon in Gold -->
    <path d="M192 230 L 220 280 L 192 270 L 164 280 Z" fill="url(#gold)"/>

    <!-- Graduation Cap / Scholar Motif -->
    <!-- Cap top diamond -->
    <polygon points="192,20 350,90 192,160 34,90" fill="url(#gold)"/>
    <!-- Cap skull cap underside -->
    <path d="M96 120 L 96 170 C 96 210, 288 210, 288 170 L 288 120 L 192 160 Z" fill="#b45309"/>
    <!-- Tassel string & drop -->
    <path d="M192 90 Q 290 110, 310 180" fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="310" cy="188" r="10" fill="#fef08a"/>
  </g>

  <!-- AI Sparks -->
  <g fill="url(#gold)">
    <!-- Top-Right 4-point star -->
    <path d="M410 70 Q 410 95, 435 95 Q 410 95, 410 120 Q 410 95, 385 95 Q 410 95, 410 70 Z"/>
    <!-- Small star -->
    <path d="M85 380 Q 85 395, 100 395 Q 85 395, 85 410 Q 85 395, 70 395 Q 85 395, 85 380 Z"/>
  </g>

  <!-- Typography: QW -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    CLASS 10
  </text>
</svg>
